<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- 2357401007 Yusuf Hidayat -->
  <!-- references from https://www.w3schools.com/ -->
  
  <style>
    body {
      margin: 0;
      background-color: #021024;
      color: #c1e8ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: left;
      background-color: #021024;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }
    .container h2 {
      margin-bottom: 20px;
      font-size: 1.8em;
    }
    .container input {
      width: 100%;
      padding: 12px;
      margin: 10px -10px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      outline: none;
    }
    .container .button-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .container button {
      background-color: #5483b3;
      color: #c1e8ff;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      flex: 1;
      margin: 0 5px;
    }
    .container button:hover {
      background-color: #4ca0ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login Admin</h2>
    <form id="loginForm">
      <input type="email" id="text" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <div class="button-group">
        <button type="button" onclick="window.location.href='index.html'">Back</button>
        <button type="submit" onclick="window.location.href='dashboard.html'">Login</button>
      </div>
    </form>
  </div>
</body>
</html>
