<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rovu Company</title>
  <style>
    body {
      margin: 0;
      background-color: #021024;
      color: #c1e8ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      background-color: #021024;
      padding: 40px;
      border-radius: 15px;
      max-width: 400px;
      width: 100%;
    }
    .container h1 {
      margin-bottom: 20px;
      font-size: 2em;
    }
    .container p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    .container button {
      background-color: #5483b3;
      color: #c1e8ff;
      border: none;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      width: 100%;
    }
    .container button:hover {
      background-color: #52a8fe;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Selamat Datang</h1>
    <p>Welcome to Rovu Company Site</p>
    <button onclick="window.location.href='login.html'">Login</button>
    <button onclick="window.location.href='daftar.html'">Daftar</button>
  </div>
</body>
</html>
